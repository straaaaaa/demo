<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無題</title>
    <link href="">

    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-wrapper {
            width: 1280px;
            height: 720px;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

<body>
    <div id="game-wrapper">
        <div id="game"></div>
    </div>
<script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room'); // 部屋の識別子（ホストのPeerID）

        let peer = null;
        let connections = []; // 繋がっている全員の接続情報を入れる配列

        if (roomId) {
            // --------------------------------------------------
            // 【後から入る人（ゲスト）】
            // --------------------------------------------------
            // ゲスト自身のIDはランダム（自動生成）
            peer = new Peer();

            peer.on('open', (myId) => {
                console.log(`【参加】あなたのID: ${myId}`);
                
                // 1. まずはURLを作成した「ホスト」に直接繋ぎにいく
                const hostConn = peer.connect(roomId);
                setupConnection(hostConn);

                // 2. ホスト側から「他の参加者のIDリスト」が送られてくるのを待ち、
                // 届いたらその人たち全員にも自分から個別に接続をかける（メッシュ構造化）
                hostConn.on('data', (data) => {
                    if (data.type === 'peer-list') {
                        data.list.forEach(otherId => {
                            if (otherId !== myId && !connections.some(c => c.peer === otherId)) {
                                console.log(`他の参加者へ接続します: ${otherId}`);
                                const otherConn = peer.connect(otherId);
                                setupConnection(otherConn);
                            }
                        });
                    }
                });
            });

            // 他の参加者から接続が来た場合も受け入れる
            peer.on('connection', (conn) => {
                setupConnection(conn);
            });

        } else {
            // --------------------------------------------------
            // 【最初の1人目（ホスト）】
            // --------------------------------------------------
            peer = new Peer();

            peer.on('open', (hostId) => {
                // ホスト自身のIDを部屋のキーとしてURLを作成
                const shareUrl = `${window.location.origin}${window.location.pathname}?room=${hostId}`;
                
                document.body.innerHTML = `
                    <h3>6〜8人用 共通接続URL</h3>
                    <p>このURLを全員に共有して開いてもらってください：</p>
                    <a href="${shareUrl}" target="_blank">${shareUrl}</a>
                `;
                console.log(`【ホスト】部屋を作成しました。ID: ${hostId}`);
            });

            // 新しい参加者が入ってきたときの処理
            peer.on('connection', (newConn) => {
                setupConnection(newConn);

                // ホストの最も重要な役割：
                // 新人が来たら、現在部屋にいる「全員のIDリスト」をその新人に教えてあげる
                newConn.on('open', () => {
                    const currentPeerIds = connections.map(c => c.peer);
                    newConn.send({ type: 'peer-list', list: currentPeerIds });
                });
            });
        }

        // --------------------------------------------------
        // 【共通】誰かと接続が確立したときの処理
        // --------------------------------------------------
        function setupConnection(conn) {
            // すでに繋がっている相手なら無視
            if (connections.some(c => c.peer === conn.peer)) return;

            conn.on('open', () => {
                connections.push(conn); // リストに追加
                console.log(`★ 接続完了！ 現在の合計接続数: ${connections.length}人`);
                
                // テスト用：繋がった瞬間に相手にメッセージを飛ばす
                conn.send(`こんにちは！相手のIDは ${conn.peer} です`);
            });

            // データ受信時
            conn.on('data', (data) => {
                if (data.type !== 'peer-list') {
                    console.log(`【受信】:`, data);
                }
            });

            // 誰かが切断したとき
            conn.on('close', () => {
                connections = connections.filter(c => c.peer !== conn.peer);
                console.log(`メンバーが退室しました。残り接続数: ${connections.length}人`);
            });
        }
    </script>

    <script>
        /**
         * エラーを画面下部の赤文字ログに出力する共通関数
         */
        function logErrorToScreen(type, message, details = "") {
            let div = document.getElementById("error-log");
            if (!div) {
                div = document.createElement("pre");
                div.id = "error-log";
                div.style.position = "fixed";
                div.style.bottom = "0";
                div.style.left = "0";
                div.style.width = "100%";
                div.style.maxHeight = "50%";
                div.style.overflow = "auto";
                div.style.background = "rgba(0, 0, 0, 0.85)"; // 少し透過させて背景を見やすく
                div.style.color = "#ff3333";
                div.style.fontSize = "12px";
                div.style.padding = "10px";
                div.style.margin = "0";
                div.style.zIndex = "999999";
                div.style.borderTop = "2px solid red";
                div.style.pointerEvents = "auto"; // ログ内をスクロールできるように
                document.body.appendChild(div);
            }

            const timestamp = new Date().toLocaleTimeString();
            const header = `[${timestamp}] --- ${type} ---`;
            const logEntry = `${header}\n${message}\n${details}\n\n`;
            
            div.textContent += logEntry;
            div.scrollTop = div.scrollHeight; // 常に最新のエラーが見えるようにスクロール
            console.error(logEntry); // コンソールにも同時に出力
        }

        // 1. 通常のJavaScript実行エラーをキャッチ
        window.onerror = function (msg, url, line, col, error) {
            const details = [
                "File: " + url,
                "Line: " + line,
                "Col: " + col,
                "Stack: " + (error && error.stack)
            ].join("\n");

            logErrorToScreen("RUNTIME ERROR", msg, details);
            return false;
        };

        // 2. Promise内のエラー（AssetLoaderなど）をキャッチ
        window.onunhandledrejection = function (event) {
            let reason = event.reason;
            let message = "No reason provided";
            let stack = "";

            if (reason instanceof Error) {
                message = reason.message;
                stack = reason.stack;
            } else if (typeof reason === "string") {
                message = reason;
            } else {
                message = JSON.stringify(reason);
            }

            logErrorToScreen("PROMISE REJECTION (Async Error)", message, "Stack: " + stack);
        };

        // 3. (任意) リソース読み込みエラー（画像やスクリプト自体の404など）をキャッチ
        window.addEventListener('error', function(event) {
            if (event.target && (event.target.src || event.target.href)) {
                logErrorToScreen("RESOURCE ERROR", "Failed to load: " + (event.target.src || event.target.href));
            }
        }, true);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
        console.log('Hello World');
    </script>
    <script type="module" src="./src/main.js" crossorigin="anonymous"></script>
</body>
</html>
